<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="840" viewBox="0 0 1280 840" role="img" aria-labelledby="title desc">
  <title id="title">Екран входу в адмінпанель з підказками</title>
  <desc id="desc">Скріншот екрана входу з чотирма стрілками до полів email, пароля, звичайного входу та входу через Google.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d35f55"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6c4f48" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1280" height="840" fill="#f8f6ed"/>
  <image x="0" y="120" width="1280" height="720" preserveAspectRatio="none" xlink:href="../../output/playwright/admin-guide/login.png"/>
  <rect x="0" y="0" width="1280" height="120" fill="#ffffff" opacity=".95"/>
  <text x="48" y="48" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#23443a">Як увійти в адмінпанель</text>
  <text x="48" y="82" font-family="Arial, sans-serif" font-size="16" fill="#5f746b">Заповніть email і пароль, потім натисніть потрібну кнопку.</text>
  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="420" cy="408" r="18" fill="#d35f55" filter="url(#shadow)"/><text x="420" y="414">1</text>
    <circle cx="845" cy="498" r="18" fill="#d35f55" filter="url(#shadow)"/><text x="845" y="504">2</text>
    <circle cx="420" cy="565" r="18" fill="#d35f55" filter="url(#shadow)"/><text x="420" y="571">3</text>
    <circle cx="845" cy="665" r="18" fill="#d35f55" filter="url(#shadow)"/><text x="845" y="671">4</text>
  </g>
  <g stroke="#d35f55" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M330 300 C350 330 385 355 420 390"/>
    <path d="M960 350 C930 395 885 440 850 480"/>
    <path d="M330 705 C350 650 385 610 420 585"/>
    <path d="M960 780 C935 735 890 705 855 680"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="14" fill="#23443a">
    <rect x="145" y="265" rx="9" width="185" height="42" fill="#fff" stroke="#d35f55" stroke-width="2"/><text x="160" y="291">1 — Email</text>
    <rect x="960" y="315" rx="9" width="190" height="42" fill="#fff" stroke="#d35f55" stroke-width="2"/><text x="975" y="341">2 — Пароль</text>
    <rect x="145" y="700" rx="9" width="185" height="42" fill="#fff" stroke="#d35f55" stroke-width="2"/><text x="160" y="726">3 — Увійти</text>
    <rect x="960" y="775" rx="9" width="245" height="42" fill="#fff" stroke="#d35f55" stroke-width="2"/><text x="975" y="801">4 — Google-вхід</text>
  </g>
</svg>
