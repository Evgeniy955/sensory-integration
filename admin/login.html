<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Вхід в адмінпанель — Центр сенсорної інтеграції</title>
<script>
(function(){
  try{
    var saved = localStorage.getItem('siteTheme');
    var theme = saved === 'light' || saved === 'cosmic'
      ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'cosmic' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){ document.documentElement.setAttribute('data-theme','light'); }
})();
</script>
<link rel="stylesheet" href="../assets/css/styles.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-shell">
  <main class="admin-login">
    <div class="admin-card">
      <h1>Адмінпанель</h1>
      <p class="admin-subtitle">Увійдіть, щоб керувати сайтом.</p>

      <form id="login-form" novalidate>
        <div class="admin-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>
        <div class="admin-field">
          <label for="password">Пароль</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="admin-btn" id="login-btn">Увійти</button>
      </form>

      <div class="admin-divider"><span>або</span></div>

      <button type="button" class="admin-btn admin-btn--google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.83.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.95v2.33A9 9 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.95A9 9 0 0 0 0 9c0 1.45.35 2.83.95 4.03l3-2.33z"/>
          <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .95 4.97l3 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
        </svg>
        Увійти через Google
      </button>

      <div data-admin-status></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>
  <script src="../assets/js/admin-auth.js"></script>
  <script>
    (async function () {
      const status = document.querySelector("[data-admin-status]");

      // Bounced back here by requireAuth() (admin-auth.js) because the
      // account has no profiles row — i.e. nobody with super_admin
      // invited them. The stray session is already signed out by then;
      // this is just the explanation.
      if (new URLSearchParams(window.location.search).get("noaccess") === "1") {
        status.innerHTML = '<div class="admin-notice admin-notice--error">' +
          "Цей обліковий запис не має доступу до адмінпанелі. Додати новий обліковий запис може лише супер адмін через «Керування користувачами»." +
          "</div>";
      }

      // Already logged in? Skip straight to the dashboard.
      const existing = await window.getCurrentProfile();
      if (existing) {
        window.location.href = "dashboard.html";
        return;
      }

      const form = document.getElementById("login-form");
      const btn = document.getElementById("login-btn");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        status.innerHTML = "";
        btn.disabled = true;
        btn.textContent = "Вхід...";

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        const { error } = await window.sbClient.auth.signInWithPassword({ email, password });

        if (error) {
          status.innerHTML = '<div class="admin-notice admin-notice--error">' +
            "Не вдалося увійти: " + error.message + "</div>";
          btn.disabled = false;
          btn.textContent = "Увійти";
          return;
        }

        window.location.href = "dashboard.html";
      });

      document.getElementById("google-btn").addEventListener("click", async () => {
        status.innerHTML = "";
        const { error } = await window.sbClient.auth.signInWithOAuth({
          provider: "google",
          options: { redirectTo: window.location.origin + window.location.pathname.replace("login.html", "dashboard.html") },
        });
        if (error) {
          status.innerHTML = '<div class="admin-notice admin-notice--error">' +
            "Не вдалося увійти через Google: " + error.message + "</div>";
        }
        // On success the browser is redirected to Google, then back to dashboard.html — nothing more to do here.
      });
    })();
  </script>
</body>
</html>
